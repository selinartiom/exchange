<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет · NEXCHANGE.MD</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161B; --panel:#1E222A; --panel-2:#22262F; --bezel:#0C0D10;
    --line:#33384344; --amber:#FF9D2E; --amber-dim:#8A551A;
    --cyan:#4DD9E8; --cyan-dim:#1D6873; --ink:#ECE9E2; --ink-dim:#9A9DA6;
    --green:#5FD98A; --red:#F0605C; --yellow:#F0C64A; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1200px 600px at 50% -10%, #1c2029 0%, var(--bg) 60%);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  .mono{font-family:'Space Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}

  nav{position:sticky;top:0;z-index:50;background:rgba(20,22,27,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;}
  .logo{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;}
  .logo span{color:var(--amber);}
  .nav-right{display:flex;align-items:center;gap:14px;}
  .back-link{color:var(--ink-dim);font-size:13.5px;}
  .back-link:hover{color:var(--ink);}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .lang-btn{background:var(--panel);color:var(--ink-dim);font-size:12px;font-weight:700;padding:7px 11px;font-family:'Space Mono',monospace;}
  .lang-btn.active{background:var(--panel-2);color:var(--amber);}

  main{padding:56px 0;}
  h1{font-size:26px;font-weight:800;margin-bottom:8px;}
  .sub{color:var(--ink-dim);font-size:14.5px;margin-bottom:36px;}

  /* Логин */
  .login-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:36px;text-align:center;}
  .login-card p{color:var(--ink-dim);font-size:14px;margin-bottom:22px;max-width:380px;margin-left:auto;margin-right:auto;}
  #telegram-login-container{display:flex;justify-content:center;}

  /* Профиль */
  .profile-bar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:24px;}
  .profile-name{font-weight:700;font-size:15px;}
  .profile-name .at{color:var(--ink-dim);font-weight:500;font-size:13px;}
  .logout-btn{background:transparent;border:1px solid var(--line);color:var(--ink-dim);padding:8px 16px;border-radius:8px;font-size:12.5px;}
  .logout-btn:hover{color:var(--red);border-color:var(--red);}

  .orders-title{font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  thead th{text-align:left;font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);}
  tbody td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  .id-cell{font-family:'Space Mono',monospace;color:var(--cyan);}
  .badge{font-family:'Space Mono',monospace;font-size:10px;padding:4px 9px;border-radius:20px;}
  .badge.AWAITING_PAYMENT{background:#3a3320;color:var(--yellow);}
  .badge.AWAITING_CONFIRMATION{background:#1d6873;color:var(--cyan);}
  .badge.COMPLETED{background:#1c3a28;color:var(--green);}
  .badge.REJECTED{background:#3a1f1f;color:var(--red);}
  .badge.EXPIRED{background:#2a2c33;color:var(--ink-dim);}
  .empty-state{padding:36px;text-align:center;color:var(--ink-dim);font-size:13px;}

  .hidden{display:none;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <div class="logo">NEX<span>CHANGE</span>.MD</div>
    <div class="nav-right">
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="ro">RO</button>
      </div>
      <a href="/" class="back-link" data-i18n="nav.back">← на сайт</a>
    </div>
  </div>
</nav>

<main class="wrap">
  <h1 data-i18n="page.title">Личный кабинет</h1>
  <p class="sub" data-i18n="page.sub">История ваших заявок на обмен и их статус.</p>

  <!-- Блок входа -->
  <div class="login-card" id="loginBlock">
    <p><span data-i18n="login.textBefore">Войдите через Telegram, чтобы видеть свои заявки — тот же аккаунт, что и в боте</span> @<span id="botNameHint">…</span>.</p>
    <div id="telegram-login-container"></div>
  </div>

  <!-- Блок кабинета -->
  <div id="cabinetBlock" class="hidden">
    <div class="profile-bar">
      <div class="profile-name" id="profileName">—</div>
      <button class="logout-btn" id="logoutBtn" data-i18n="cabinet.logout">Выйти</button>
    </div>
    <div class="orders-title" data-i18n="cabinet.ordersTitle">Ваши заявки</div>
    <table>
      <thead><tr>
        <th data-i18n="table.id">ID</th><th data-i18n="table.pair">Пара</th>
        <th data-i18n="table.date">Дата</th><th data-i18n="table.status">Статус</th>
      </tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</main>

<script>
let CSRF_TOKEN = '';
fetch('/api/csrf-token').then(r => r.json()).then(d => { CSRF_TOKEN = d.csrfToken; }).catch(() => {});

const I18N = {
  ru: {
    'nav.back': '← на сайт',
    'page.title': 'Личный кабинет', 'page.sub': 'История ваших заявок на обмен и их статус.',
    'login.textBefore': 'Войдите через Telegram, чтобы видеть свои заявки — тот же аккаунт, что и в боте',
    'cabinet.logout': 'Выйти', 'cabinet.ordersTitle': 'Ваши заявки',
    'table.id': 'ID', 'table.pair': 'Пара', 'table.date': 'Дата', 'table.status': 'Статус',
    'cabinet.empty': 'Заявок пока нет — оформите первую на главной странице',
    'cabinet.client': 'Клиент',
    'status.AWAITING_PAYMENT': 'Ждёт оплаты', 'status.AWAITING_CONFIRMATION': 'На проверке',
    'status.COMPLETED': 'Выполнено', 'status.REJECTED': 'Отклонено', 'status.EXPIRED': 'Просрочено',
    'login.error': 'Ошибка входа: ',
  },
  ro: {
    'nav.back': '← la site',
    'page.title': 'Cont personal', 'page.sub': 'Istoricul cererilor dumneavoastră de schimb și statusul lor.',
    'login.textBefore': 'Autentificați-vă prin Telegram pentru a vedea cererile — același cont ca la bot',
    'cabinet.logout': 'Ieșire', 'cabinet.ordersTitle': 'Cererile dumneavoastră',
    'table.id': 'ID', 'table.pair': 'Pereche', 'table.date': 'Data', 'table.status': 'Status',
    'cabinet.empty': 'Nu aveți cereri încă — creați una pe pagina principală',
    'cabinet.client': 'Client',
    'status.AWAITING_PAYMENT': 'Așteaptă plata', 'status.AWAITING_CONFIRMATION': 'În verificare',
    'status.COMPLETED': 'Finalizat', 'status.REJECTED': 'Respins', 'status.EXPIRED': 'Expirat',
    'login.error': 'Eroare la autentificare: ',
  },
};
window.CURRENT_LANG = localStorage.getItem('nx_lang') || 'ru';

function applyLang(lang){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(I18N[lang][key] !== undefined) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  document.getElementById('htmlRoot').lang = lang;
  localStorage.setItem('nx_lang', lang);
  window.CURRENT_LANG = lang;
  renderOrders(window.LAST_ORDERS || []); // перерисовать таблицу с переведёнными статусами
}
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.dataset.lang));
});

// Юзернейм бота подставляется в виджет входа. Замените, если запускаете под другим ботом.
const BOT_USERNAME = 'nexchange_md_bot';
document.getElementById('botNameHint').textContent = BOT_USERNAME;

// Динамически создаём Telegram Login Widget — так проще один раз задать BOT_USERNAME
const script = document.createElement('script');
script.src = 'https://telegram.org/js/telegram-widget.js?22';
script.setAttribute('data-telegram-login', BOT_USERNAME);
script.setAttribute('data-size', 'large');
script.setAttribute('data-radius', '8');
script.setAttribute('data-onauth', 'onTelegramAuth(user)');
script.setAttribute('data-request-access', 'write');
script.async = true;
document.getElementById('telegram-login-container').appendChild(script);

async function onTelegramAuth(user){
  try{
    const res = await fetch('/api/auth/telegram', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(user)
    });
    if(!res.ok) throw new Error('Не удалось подтвердить вход');
    await loadCabinet();
  }catch(err){
    alert(I18N[window.CURRENT_LANG]['login.error'] + err.message);
  }
}
window.onTelegramAuth = onTelegramAuth;

function renderOrders(orders){
  window.LAST_ORDERS = orders;
  const L = I18N[window.CURRENT_LANG];
  const body = document.getElementById('ordersBody');
  body.innerHTML = orders.length
    ? orders.map(o => `<tr>
        <td class="id-cell">#${o.id}</td>
        <td>${o.amountIn} ${o.fromAsset} → ${o.amountOut} ${o.toAsset}</td>
        <td class="mono" style="color:var(--ink-dim);font-size:12px;">${new Date(o.createdAt).toLocaleString('ru-RU')}</td>
        <td><span class="badge ${o.status}">${L['status.'+o.status] || o.status}</span></td>
      </tr>`).join('')
    : `<tr><td colspan="4" class="empty-state">${L['cabinet.empty']}</td></tr>`;
}

async function loadCabinet(){
  const meRes = await fetch('/api/auth/me');
  if(!meRes.ok){
    document.getElementById('loginBlock').classList.remove('hidden');
    document.getElementById('cabinetBlock').classList.add('hidden');
    return;
  }
  const me = await meRes.json();
  document.getElementById('loginBlock').classList.add('hidden');
  document.getElementById('cabinetBlock').classList.remove('hidden');
  document.getElementById('profileName').innerHTML =
    (me.firstName || I18N[window.CURRENT_LANG]['cabinet.client']) + (me.username ? ` <span class="at">@${me.username}</span>` : '');

  const ordersRes = await fetch('/api/auth/me/orders');
  renderOrders(await ordersRes.json());
}

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await fetch('/api/auth/logout', {method:'POST', headers:{'X-CSRF-Token': CSRF_TOKEN}});
  window.location.reload();
});

applyLang(window.CURRENT_LANG);
loadCabinet();
</script>
</body>
</html>
